engine: bragg_grating
version: 1
title: Bragg grating
description: Coupling coefficient, peak reflectance, bandwidth and exact stack reflectance of a Bragg grating.
references:
  - "H. Kogelnik, in Guided-Wave Optoelectronics, ed. T. Tamir (Springer, 1988)"
  - "M. Born and E. Wolf, Principles of Optics, §1.6 (characteristic matrices)"
common_inputs:
  wavelength: {label: "Vacuum wavelength", ui_unit: nm, scale: 1.0e-9, default: 1550, min: 100}
functions:
  coupling_coefficient:
    title: Coupling coefficient κ
    equations: ["κ = 2 Δn sin(π m f) / (m λ)"]
    inputs:
      - {name: delta_n, label: "Index contrast Δn", ui_unit: "", scale: 1.0, default: 0.0177, min: 0}
      - wavelength
      - {name: fill_factor, label: "Filling ratio f", ui_unit: "", scale: 1.0, default: 0.5, min: 0, max: 1}
      - {name: order, label: "Bragg order m", ui_unit: "", scale: 1.0, default: 1, min: 1, step: 1}
    outputs:
      - {name: kappa, label: "Coupling coefficient κ", ui_unit: 1/cm, scale: 100.0}
  grating_summary:
    title: Peak reflectance and bandwidth
    equations: ["R = tanh^2(κL)", "Δλ_null = λ^2 / (π n_g L) sqrt((κL)^2 + π^2)", "L_eff = tanh(κL) / (2κ)"]
    inputs:
      - {name: kappa, label: "Coupling coefficient κ", ui_unit: 1/cm, scale: 100.0, default: 229}
      - {name: length, label: "Grating length L", ui_unit: µm, scale: 1.0e-6, default: 307}
      - wavelength
      - {name: n_group, label: "Group index", ui_unit: "", scale: 1.0, default: 2.33, min: 1}
    outputs:
      - {name: R_peak, label: "Peak reflectance", ui_unit: "", scale: 1.0}
      - {name: bandwidth_null, label: "Null-to-null bandwidth", ui_unit: nm, scale: 1.0e-9}
      - {name: L_eff, label: "Effective length", ui_unit: µm, scale: 1.0e-6}
      - {name: kappa_L, label: "κL", ui_unit: "", scale: 1.0}
  stack_reflectance:
    title: Quarter-wave or arbitrary periodic stack
    equations: ["[E0, H0] = (M_H M_L)^N [Es, Hs]", "M = [[cos δ, -i sin δ / n], [-i n sin δ, cos δ]]"]
    inputs:
      - wavelength
      - {name: n_high, label: "High index", ui_unit: "", scale: 1.0, default: 2.0272, min: 1}
      - {name: n_low, label: "Low index", ui_unit: "", scale: 1.0, default: 2.0095, min: 1}
      - {name: d_high, label: "High-index layer thickness", ui_unit: nm, scale: 1.0e-9, default: 191.2}
      - {name: d_low, label: "Low-index layer thickness", ui_unit: nm, scale: 1.0e-9, default: 192.8}
      - {name: periods, label: "Periods N", ui_unit: "", scale: 1.0, default: 800, min: 1, step: 1}
    outputs:
      - {name: R, label: "Reflectance", ui_unit: "", scale: 1.0}
      - {name: T, label: "Transmittance", ui_unit: "", scale: 1.0}
