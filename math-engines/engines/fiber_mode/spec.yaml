engine: fiber_mode
version: 1
title: Step-index silica fiber
description: Fused-silica index, the scalar LP01 mode of a step-index fiber and the three-/four-wave phase mismatch it produces.
references:
  - "I. H. Malitson, Interspecimen comparison of the refractive index of fused silica, JOSA 55, 1205 (1965)"
  - "D. Marcuse, Loss analysis of single-mode fiber splices, Bell Syst. Tech. J. 56, 703 (1977)"
  - "A. W. Snyder and J. D. Love, Optical Waveguide Theory (1983)"
common_inputs:
  core_radius: {label: "Core radius a", ui_unit: µm, scale: 1.0e-6, default: 4.1, min: 0.5, max: 50}
  delta_n: {label: "Core index step Δn", ui_unit: "1", scale: 1.0, default: 0.005, min: 0.0005, max: 0.05}
  lambda_signal: {label: "Signal wavelength", ui_unit: nm, scale: 1.0e-9, default: 1550, min: 400, max: 3000}
functions:
  silica_index:
    title: Fused-silica refractive index
    equations: ["n^2 - 1 = sum_k B_k lambda^2 / (lambda^2 - C_k^2)"]
    inputs:
      - {name: wavelength, label: "Vacuum wavelength", ui_unit: nm, scale: 1.0e-9, default: 1550, min: 210, max: 3700}
    outputs:
      - {name: n, label: "Refractive index", ui_unit: "1", scale: 1.0}
  lp01_mode:
    title: LP01 mode of a step-index fiber
    equations: ["U J1(U)/J0(U) = W K1(W)/K0(W), U^2 + W^2 = V^2", "w/a = 0.65 + 1.619 V^-3/2 + 2.879 V^-6"]
    inputs:
      - {name: wavelength, label: "Vacuum wavelength", ui_unit: nm, scale: 1.0e-9, default: 1550, min: 210, max: 3700}
      - core_radius
      - delta_n
    outputs:
      - {name: n_eff, label: "Effective index", ui_unit: "1", scale: 1.0}
      - {name: V, label: "Normalised frequency V", ui_unit: "1", scale: 1.0}
      - {name: b, label: "Normalised propagation constant b", ui_unit: "1", scale: 1.0}
      - {name: w_mode, label: "Mode radius (1/e² intensity)", ui_unit: µm, scale: 1.0e-6}
  phase_mismatch:
    title: Phase mismatch and group-velocity mismatch
    equations: ["chi2: dk = k_p - k_s - k_i", "chi3: dbeta = k_s + k_i - 2 k_p", "GVM = beta1_i - beta1_s"]
    inputs:
      - lambda_signal
      - {name: lambda_pump, label: "Pump wavelength", ui_unit: nm, scale: 1.0e-9, default: 532, min: 300, max: 2500}
      - core_radius
      - delta_n
      - {name: process, label: "Process", choices: [chi2, chi3], default: chi2}
    outputs:
      - {name: dk0, label: "Linear mismatch at the signal", ui_unit: rad/m, scale: 1.0}
      - {name: gvm, label: "GVM β1,i − β1,s", ui_unit: ps/m, scale: 1.0e-12}
      - {name: beta2_sum, label: "β2,s + β2,i", ui_unit: ps²/km, scale: 1.0e-27}
      - {name: lambda_idler, label: "Idler wavelength", ui_unit: nm, scale: 1.0e-9}
      - {name: qpm_period, label: "QPM period (chi2)", ui_unit: µm, scale: 1.0e-6}
