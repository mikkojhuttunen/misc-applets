engine: gas_cell
version: 4
title: Gas-sensing cells, deformed Herriott against CMPC
description: An elongated integrated Herriott cell with smooth deformed, rippled or curved-segmented mirrors and optional refractive-index inclusions (the baseline) against a circular multipass cell of the same footprint area, both fed by the same Gaussian beam. Path, throughput and absorbance per ppm (what you gain) against chaos (twin-ray Lyapunov exponent, dither visibility of the fringes) and a Gaussian-beam two-mirror model along the traced path; a tangent-map chaos map (FTLE, MEGNO) that tells whether the beam launches into the chaotic sea or onto a regular island; shot-noise and fringe-limited detection limits.
references:
  - "D. Herriott, H. Kogelnik, R. Kompfner, Appl. Opt. 3, 523 (1964) (off-axis paths in spherical mirror interferometers)"
  - "H. Kogelnik, T. Li, Appl. Opt. 5, 1550 (1966) (laser beams and resonators, ABCD)"
  - "J. B. McManus, P. L. Kebabian, M. S. Zahniser, Appl. Opt. 34, 3336 (1995) (astigmatic multipass cells, fringe and path design)"
  - "L. A. Bunimovich, Commun. Math. Phys. 65, 295 (1979) (ergodic billiards); G. Benettin et al., Meccanica 15, 9 (1980) (Lyapunov exponents)"
  - "B. V. Chirikov, Phys. Rep. 52, 263 (1979) (standard map, stochasticity K)"
  - "P. M. Cincotta, C. Simó, Astron. Astrophys. Suppl. 147, 205 (2000) (MEGNO chaos indicator)"
  - "P. J. Acklam, An algorithm for computing the inverse normal cumulative distribution function (2003)"
functions:
  compare:
    title: Deformed Herriott cell against the CMPC
    equations: ["R = L / (1 − cos 2πM/N),  S(η) = cη²/(1 + √(1 − (1+k)c²η²)) + a3 η³ + a4 η⁴,  a4 = eps4 c/(2a²)", "A_ppm = 100 α_ppm Γ ⟨L⟩,  NEC_shot = √(2qB/(P_in T))/A_ppm", "NEC_fringe = 2 √f_par V_det / A_ppm,  V_det = V/√M² (speckle_avg)",  "V = |∫₀¹ e^{iΔφ(θc + δ(s))} ds| by adaptive Filon quadrature", "q' = (Aq + B)/(Cq + D),  mirror C = −2κ/cos χ", "n1 sin θ1 = n2 sin θ2 at the inclusions (TIR when impossible)", "M² = (4π/λm) √(⟨y²⟩⟨u²⟩ − ⟨yu⟩²)", "S += a sin(2πη/Λ + φ),  K = 8π² a L / Λ²", "⟨Y⟩ = mean_n (2/n) Σ k ln g_k  (0 periodic, 2 torus, ≈ λn/2 chaos)"]
    inputs:
      - {name: L, label: "Cell length (mirror spacing)", ui_unit: mm, scale: 1.0e-3, default: 15}
      - {name: W, label: "Cell width (mirror aperture)", ui_unit: mm, scale: 1.0e-3, default: 1.5}
      - {name: N, label: "Hits to re-entrance N (even)", ui_unit: "", scale: 1.0, default: 14, min: 4, step: 1}
      - {name: M, label: "Pattern turns M", ui_unit: "", scale: 1.0, default: 3, min: 1, step: 1}
      - {name: distinct, label: "Distinct spots (phase π/N) 1/0", ui_unit: "", scale: 1.0, default: 1, min: 0, max: 1, step: 1}
      - {name: port_width, label: "Window width (0 = 2.5 mode radii)", ui_unit: µm, scale: 1.0e-6, default: 0, min: 0}
      - {name: eps4, label: "Quartic deformation (fraction of the edge sag)", ui_unit: "", scale: 1.0, default: 0}
      - {name: eps3, label: "Cubic deformation (fraction of the edge sag)", ui_unit: "", scale: 1.0, default: 0}
      - {name: conic, label: "Conic constant", ui_unit: "", scale: 1.0, default: 0}
      - {name: deform, label: "Deformed mirror(s)", type: choice, choices: [both, M1, M2], default: both}
      - {name: walls, label: "Reflecting side walls 1/0", ui_unit: "", scale: 1.0, default: 0, min: 0, max: 1, step: 1}
      - {name: n_seg, label: "Mirror segments per mirror (0 = smooth)", ui_unit: "", scale: 1.0, default: 0, min: 0, step: 1}
      - {name: seg_curv, label: "Segment curvature / mirror curvature (0 = flat facets)", ui_unit: "", scale: 1.0, default: 1, min: 0}
      - {name: seg_tilt, label: "Segment tilt jitter (rms)", ui_unit: mrad, scale: 1.0e-3, default: 0, min: 0}
      - {name: seg_seed, label: "Segment tilt seed", ui_unit: "", scale: 1.0, default: 1, min: 1, step: 1}
      - {name: n_inc, label: "Index inclusions in the cell", ui_unit: "", scale: 1.0, default: 0, min: 0, step: 1}
      - {name: inc_radius, label: "Inclusion radius", ui_unit: µm, scale: 1.0e-6, default: 50, min: 1}
      - {name: inc_dn, label: "Inclusion index change |Δn_eff|", ui_unit: "", scale: 1.0, default: 0.01, min: 0}
      - {name: inc_sign, label: "Sign of Δn_eff", type: choice, choices: [both, plus, minus], default: both}
      - {name: inc_seed, label: "Inclusion placement seed", ui_unit: "", scale: 1.0, default: 1, min: 1, step: 1}
      - {name: inc_circle, label: "Same inclusions in the circular cell 1/0", ui_unit: "", scale: 1.0, default: 0, min: 0, max: 1, step: 1}
      - {name: ripple_a, label: "End-mirror ripple amplitude", ui_unit: µm, scale: 1.0e-6, default: 0, min: 0}
      - {name: ripple_period, label: "Ripple period Λ", ui_unit: mm, scale: 1.0e-3, default: 0.5, min: 0.01}
      - {name: ripple_phase, label: "Ripple phase at the mirror centre", ui_unit: rad, scale: 1.0, default: 0}
      - {name: ripple_on, label: "Rippled mirror(s)", type: choice, choices: [both, M1, M2], default: both}
      - {name: n_facets, label: "CMPC facets", ui_unit: "", scale: 1.0, default: 24, min: 3, step: 1}
      - {name: circle_theta, label: "CMPC launch angle", ui_unit: rad, scale: 1.0, default: 0.35}
      - {name: out_frac, label: "CMPC output port position (fraction of the perimeter)", ui_unit: "", scale: 1.0, default: 0.37}
      - {name: smooth_circle, label: "Smooth circle instead of facets 1/0", ui_unit: "", scale: 1.0, default: 0, min: 0, max: 1, step: 1}
      - {name: wavelength, label: "Vacuum wavelength", ui_unit: nm, scale: 1.0e-9, default: 1653.7}
      - {name: n_eff, label: "Slab n_eff", ui_unit: "", scale: 1.0, default: 2.0, min: 1}
      - {name: gamma, label: "Gas overlap Γ", ui_unit: "", scale: 1.0, default: 0.2, min: 0, max: 1}
      - {name: species, label: "Gas (strongest listed line)", type: choice, choices: [CH4, NH3, CO2, H2O], default: CH4}
      - {name: R_mirror, label: "Mirror reflectance", ui_unit: "", scale: 1.0, default: 0.995, min: 0, max: 1}
      - {name: dither, label: "Launch-angle dither amplitude", ui_unit: mrad, scale: 1.0e-3, default: 2}
      - {name: waveform, label: "Dither waveform", type: choice, choices: [sine, triangle], default: sine}
      - {name: f_parasitic, label: "Parasitic (fringe) power fraction", ui_unit: "", scale: 1.0, default: 1.0e-6}
      - {name: P_in, label: "Input power", ui_unit: mW, scale: 1.0e-3, default: 1}
      - {name: bandwidth, label: "Noise bandwidth", ui_unit: Hz, scale: 1.0, default: 1}
      - {name: n_side, label: "Beam rays per side (n_side² rays)", ui_unit: "", scale: 1.0, default: 24, min: 4, step: 1}
      - {name: n_bounce, label: "Hit limit per ray", ui_unit: "", scale: 1.0, default: 2000, min: 10, step: 1}
      - {name: retune_launch, label: "Re-aim the baseline launch for the best Γ T ⟨L⟩ 1/0", ui_unit: "", scale: 1.0, default: 1, min: 0, max: 1, step: 1}
      - {name: n_dither_max, label: "Ray budget of the dither integral", ui_unit: "", scale: 1.0, default: 24000, min: 600, step: 1}
      - {name: speckle_avg, label: "Detector averages the speckle (V_det = V/√M²) 1/0", ui_unit: "", scale: 1.0, default: 0, min: 0, max: 1, step: 1}
      - {name: chaos_grid, label: "Chaos map grid (n × n departures; 0 = launch only)", ui_unit: "", scale: 1.0, default: 20, min: 0, step: 1}
      - {name: n_ftle, label: "Hits per chaos-map ray", ui_unit: "", scale: 1.0, default: 300, min: 30, step: 1}
    outputs:
      - {name: h_L_mean, label: "Herriott: mean detected path", ui_unit: cm, scale: 1.0e-2}
      - {name: h_T, label: "Herriott: detected power", ui_unit: "", scale: 1.0}
      - {name: h_A_ppm, label: "Herriott: absorbance per ppm", ui_unit: 1/ppm, scale: 1.0}
      - {name: h_nec, label: "Herriott: noise-equivalent concentration", ui_unit: ppm, scale: 1.0}
      - {name: h_lam, label: "Herriott: Lyapunov exponent", ui_unit: 1/hit, scale: 1.0}
      - {name: h_V, label: "Herriott: dither visibility at the exit", ui_unit: "", scale: 1.0}
      - {name: h_V_floor, label: "Herriott: error of V (adaptive dither integral)", ui_unit: "", scale: 1.0}
      - {name: h_V_det, label: "Herriott: fringe at the detector", ui_unit: "", scale: 1.0}
      - {name: h_nec_fringe_hi, label: "Herriott: fringe NEC upper bound (V + V_err)", ui_unit: ppm, scale: 1.0}
      - {name: h_T_G, label: "Herriott: power kept in one Gaussian beam", ui_unit: "", scale: 1.0}
      - {name: h_M2, label: "Herriott: M² of the detected light", ui_unit: "", scale: 1.0}
      - {name: h_m_max, label: "Herriott: largest round-trip |m|", ui_unit: "", scale: 1.0}
      - {name: h_theta, label: "Herriott: launch angle used", ui_unit: mrad, scale: 1.0e-3}
      - {name: h_K_ripple, label: "Herriott: ripple stochasticity K", ui_unit: "", scale: 1.0}
      - {name: h_f_launch, label: "Herriott: launch rays in the chaotic sea", ui_unit: "", scale: 1.0}
      - {name: h_esc_launch, label: "Herriott: launch rays gone within 30 hits", ui_unit: "", scale: 1.0}
      - {name: h_Y_launch, label: "Herriott: median MEGNO of the launch", ui_unit: "", scale: 1.0}
      - {name: h_lam_ftle, label: "Herriott: median finite-time Lyapunov exponent", ui_unit: 1/hit, scale: 1.0}
      - {name: h_sea, label: "Herriott: chaotic share of the M1 section", ui_unit: "", scale: 1.0}
      - {name: h_island, label: "Herriott: regular share of the M1 section", ui_unit: "", scale: 1.0}
      - {name: h_verdict, label: "Herriott: launch verdict (2 sea, 1 island, 0 no sea, −1 escapes)", ui_unit: "", scale: 1.0}
      - {name: c_L_mean, label: "CMPC: mean detected path", ui_unit: cm, scale: 1.0e-2}
      - {name: c_T, label: "CMPC: detected power", ui_unit: "", scale: 1.0}
      - {name: c_A_ppm, label: "CMPC: absorbance per ppm", ui_unit: 1/ppm, scale: 1.0}
      - {name: c_nec, label: "CMPC: noise-equivalent concentration", ui_unit: ppm, scale: 1.0}
      - {name: c_lam, label: "CMPC: Lyapunov exponent", ui_unit: 1/hit, scale: 1.0}
      - {name: c_V, label: "CMPC: dither visibility at the exit", ui_unit: "", scale: 1.0}
      - {name: c_T_G, label: "CMPC: power kept in one Gaussian beam", ui_unit: "", scale: 1.0}
      - {name: c_M2, label: "CMPC: M² of the detected light", ui_unit: "", scale: 1.0}
      - {name: path_gain, label: "Path gain ⟨L⟩_H / ⟨L⟩_C", ui_unit: "", scale: 1.0}
      - {name: sensitivity_gain, label: "Sensitivity gain (Γ T ⟨L⟩)_H / (…)_C", ui_unit: "", scale: 1.0}
      - {name: washout_lost, label: "Washout lost V_H − V_C", ui_unit: "", scale: 1.0}
      - {name: chaos_lost, label: "Chaos lost λ_C − λ_H", ui_unit: 1/hit, scale: 1.0}
      - {name: nec_ratio, label: "NEC_H / NEC_C", ui_unit: "", scale: 1.0}
