engine: idler_loss
version: 1
title: Dissipative idler channel
description: Continuous and lumped idler loss in a parametric amplifier — spectral loss profiles, exact undepleted-pump gain with idler dumps and/or distributed absorption, and the adiabatic (strong-loss) limit. Used by opa_chi2 and opa_chi3.
references:
  - "R. W. Boyd, Nonlinear Optics, 3rd ed. (Academic Press, 2008), §2.9"
  - "M. E. Marhic, Fiber Optical Parametric Amplifiers, Oscillators and Related Devices (Cambridge, 2007)"
functions:
  linear_gain:
    title: Gain with idler loss
    equations: ["d/dz [s, c] = [[-α_s/2, iΓ], [-iΓ, iΔk - α_i/2]] [s, c],  c = a_i* e^{iΔkz}", "dumps at z = kL/(N+1): c → 10^(-dB/20) c", "strong loss: g_s = Γ² α_i / ((α_i/2)² + Δk²)"]
    inputs:
      - {name: gamma, label: "Gain coefficient Γ (χ3: √(γ_sγ_i) P)", ui_unit: 1/cm, scale: 100.0, default: 1.2, min: 0}
      - {name: delta_k, label: "Mismatch Δk (χ3: κ)", ui_unit: 1/cm, scale: 100.0, default: 0.5}
      - {name: length, label: "Length", ui_unit: mm, scale: 1.0e-3, default: 30, min: 0}
      - {name: alpha_idler, label: "Continuous idler loss", ui_unit: dB/cm, scale: 23.025850929940457, default: 0, min: 0}
      - {name: dumps, label: "Number of idler dumps N", ui_unit: "", scale: 1.0, default: 4, min: 0, step: 1}
      - {name: dump_loss_db, label: "Attenuation per dump", ui_unit: dB, scale: 1.0, default: 30, min: 0}
    outputs:
      - {name: signal_gain_db, label: "Signal gain", ui_unit: dB, scale: 1.0}
      - {name: lossless_gain_db, label: "Lossless gain (same Γ, Δk, L)", ui_unit: dB, scale: 1.0}
      - {name: idler_photon_conversion, label: "Idler photons out / signal photon in", ui_unit: "", scale: 1.0}
      - {name: idler_attenuation_db, label: "Total idler attenuation", ui_unit: dB, scale: 1.0}
      - {name: adiabatic_gain_coefficient, label: "Adiabatic gain rate (α_i ≫ Γ)", ui_unit: 1/cm, scale: 100.0}
  loss_spectrum:
    title: Loss profile
    equations: ["pass: w = ½[tanh((λ - c + W/2)/e) - tanh((λ - c - W/2)/e)]", "stop: w = 1 - pass,  flat: w = 1", "α_i(λ) = α_i,peak w(λ),  dump(λ) = dB_peak w(λ)"]
    inputs:
      - {name: profile, label: "Profile", type: choice, choices: [pass, stop, flat], default: pass}
      - {name: wavelength, label: "Idler wavelength", ui_unit: nm, scale: 1.0e-9, default: 1570, min: 100}
      - {name: band_center, label: "Band centre", ui_unit: nm, scale: 1.0e-9, default: 1570, min: 100}
      - {name: band_width, label: "Band width", ui_unit: nm, scale: 1.0e-9, default: 10, min: 0}
      - {name: band_edge, label: "Edge width", ui_unit: nm, scale: 1.0e-9, default: 0.5, min: 0}
      - {name: alpha_idler, label: "Peak continuous loss", ui_unit: dB/m, scale: 0.23025850929940457, default: 500, min: 0}
      - {name: dump_loss_db, label: "Peak attenuation per dump", ui_unit: dB, scale: 1.0, default: 30, min: 0}
    outputs:
      - {name: weight, label: "Loss weight w", ui_unit: "", scale: 1.0}
      - {name: alpha_idler_db, label: "Continuous loss here", ui_unit: dB/m, scale: 1.0}
      - {name: dump_loss_db, label: "Dump attenuation here", ui_unit: dB, scale: 1.0}
