engine: parametric_amplifier
version: 1
title: Fiber parametric amplifier
description: chi2 three-wave and chi3 four-wave optical parametric amplification with pump depletion, idler loss engineering and gain bandwidth.
references:
  - "R. W. Boyd, Nonlinear Optics, 3rd ed., sec. 2.9 (parametric amplification)"
  - "G. P. Agrawal, Nonlinear Fiber Optics, ch. 10 (four-wave mixing)"
  - "J. Ma et al., Quasi-parametric amplification of chirped pulses based on a Sm3+-doped yttrium calcium oxyborate crystal, Optica 2, 1006 (2015)"
common_inputs:
  process: {label: "Process", type: choice, choices: [chi2, chi3], default: chi2}
  lambda_pump: {label: "Pump wavelength", ui_unit: nm, scale: 1.0e-9, default: 532, min: 300, max: 2500}
  lambda_signal: {label: "Signal wavelength", ui_unit: nm, scale: 1.0e-9, default: 1550, min: 400, max: 3000}
  pump_power: {label: "Pump power", ui_unit: W, scale: 1.0, default: 1.0, min: 0.0001, max: 1000}
  length: {label: "Fiber length", ui_unit: m, scale: 1.0, default: 5.0, min: 0.01, max: 1000}
  gain_coefficient: {label: "Gain coefficient Γ", ui_unit: 1/m, scale: 1.0, default: 0.95, min: 0, max: 1000}
  phase_mismatch: {label: "Phase mismatch Δk (chi2) or κ (chi3)", ui_unit: rad/m, scale: 1.0, default: 0, min: -1000, max: 1000}
  idler_loss: {label: "Idler loss α_i", ui_unit: 1/m, scale: 1.0, default: 0, min: 0, max: 1000}
functions:
  coupling:
    title: Gain coefficient from the nonlinearity and mode sizes
    equations: ["chi2: Gamma = K sqrt(P_p / hbar w_p), K = 2 d sqrt(hbar w_p w_s w_i / (2 eps0 c^3 n^3)) Theta",
                "chi3: Gamma = gamma_p P_p sqrt(w_s w_i) / w_p, gamma_p = n2 w_p / (c A_eff)"]
    inputs:
      - process
      - lambda_pump
      - lambda_signal
      - {name: w_pump, label: "Pump mode radius", ui_unit: µm, scale: 1.0e-6, default: 2.5, min: 0.5, max: 100}
      - {name: w_signal, label: "Signal mode radius", ui_unit: µm, scale: 1.0e-6, default: 5.0, min: 0.5, max: 100}
      - {name: w_idler, label: "Idler mode radius", ui_unit: µm, scale: 1.0e-6, default: 3.18, min: 0.5, max: 100}
      - pump_power
      - {name: d_eff, label: "d_eff (chi2)", ui_unit: pm/V, scale: 1.0e-12, default: 0.08, min: 0.001, max: 100}
      - {name: n2, label: "n2 (chi3)", ui_unit: "1e-20 m²/W", scale: 1.0e-20, default: 2.6, min: 0.1, max: 10000}
    outputs:
      - {name: gain_coefficient, label: "Gain coefficient Γ", ui_unit: 1/m, scale: 1.0}
      - {name: A_eff, label: "Effective area", ui_unit: µm², scale: 1.0e-12}
      - {name: lambda_idler, label: "Idler wavelength", ui_unit: nm, scale: 1.0e-9}
      - {name: gamma, label: "γ at the pump (chi3)", ui_unit: 1/(W km), scale: 1.0e-3}
      - {name: nonlinear_phase, label: "2γP (chi3)", ui_unit: rad/m, scale: 1.0}
  small_signal_gain:
    title: Undepleted-pump signal gain
    equations: ["d/dz [s, c] = [[-a_s/2, i Gamma], [-i Gamma, i dk - a_i/2]] [s, c]", "G = 1 + (Gamma/g)^2 sinh^2(g L) without loss"]
    inputs:
      - gain_coefficient
      - phase_mismatch
      - length
      - idler_loss
      - {name: signal_loss, label: "Signal loss α_s", ui_unit: 1/m, scale: 1.0, default: 0, min: 0, max: 1000}
      - {name: n_dumps, label: "Number of idler dumps", ui_unit: "", scale: 1.0, default: 0, min: 0, max: 1000, step: 1}
      - {name: idler_dump_transmission, label: "Idler transmission per dump", ui_unit: "", scale: 1.0, default: 1.0, min: 0, max: 1}
    outputs:
      - {name: gain_db, label: "Signal gain", ui_unit: dB, scale: 1.0}
      - {name: gain, label: "Signal gain (linear)", ui_unit: "", scale: 1.0}
      - {name: idler_conversion, label: "Idler photons out / signal photons in", ui_unit: "", scale: 1.0}
  amplify:
    title: Full coupled-wave solution (pump depletion)
    equations: ["RK4 integration of the three coupled amplitude equations"]
    inputs:
      - process
      - lambda_pump
      - lambda_signal
      - pump_power
      - {name: signal_power, label: "Signal input power", ui_unit: mW, scale: 1.0e-3, default: 0.01, min: 1.0e-9, max: 10000}
      - length
      - gain_coefficient
      - phase_mismatch
      - idler_loss
    outputs:
      - {name: gain_db, label: "Signal gain", ui_unit: dB, scale: 1.0}
      - {name: P_signal_out, label: "Signal output", ui_unit: mW, scale: 1.0e-3}
      - {name: P_idler_out, label: "Idler output", ui_unit: mW, scale: 1.0e-3}
      - {name: P_pump_out, label: "Pump output", ui_unit: W, scale: 1.0}
      - {name: pump_depletion, label: "Pump depletion", ui_unit: "%", scale: 0.01}
      - {name: photon_residual, label: "Photon-number check", ui_unit: "", scale: 1.0}
  gain_bandwidth:
    title: Gain bandwidth in nm and GHz
    equations: ["dk(Omega) = dk0 + s (GVM Omega - (beta2_s + beta2_i) Omega^2 / 2)", "Delta-lambda = lambda^2 Delta-nu / c"]
    inputs:
      - gain_coefficient
      - length
      - lambda_signal
      - lambda_pump
      - {name: gvm, label: "GVM β1,i − β1,s", ui_unit: ps/m, scale: 1.0e-12, default: 15.16, min: -1000, max: 1000}
      - {name: beta2_sum, label: "β2,s + β2,i", ui_unit: ps²/km, scale: 1.0e-27, default: 13.0, min: -10000, max: 10000}
      - phase_mismatch
      - idler_loss
      - process
    outputs:
      - {name: width_nm, label: "Signal −3 dB width", ui_unit: nm, scale: 1.0e-9}
      - {name: width_hz, label: "Signal −3 dB width", ui_unit: GHz, scale: 1.0e+9}
      - {name: idler_width_nm, label: "Idler −3 dB width", ui_unit: nm, scale: 1.0e-9}
      - {name: peak_gain_db, label: "Peak gain", ui_unit: dB, scale: 1.0}
