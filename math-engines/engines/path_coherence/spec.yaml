engine: path_coherence
version: 1
title: Multipath interference (speckle) noise
description: Random-phase path model of interference noise in multipass cells; thermal pattern shift, two-path coherence and equal-path contrast as calculator functions (the full model works on billiard_cell ray tables).
references:
  - "J. W. Goodman, Speckle Phenomena in Optics (Roberts, 2007), ch. 3 and 5 (random phasor sums, polychromatic speckle)"
  - "J. A. Silver, Appl. Opt. 44, 6545 (2005) (etalon fringes in multipass cells)"
functions:
  thermal_shift:
    title: Thermal shift of the fringe pattern
    equations: ["Δν_eq = ν₀ (dn_eff/dT) ΔT / n_g"]
    inputs:
      - {name: wavelength, label: "Vacuum wavelength", ui_unit: nm, scale: 1.0e-9, default: 1531.7, min: 200}
      - {name: dneff_dT, label: "dn_eff/dT", ui_unit: 1/K, scale: 1.0, default: 1.5e-4}
      - {name: delta_T, label: "Temperature step ΔT", ui_unit: mK, scale: 1.0e-3, default: 10}
      - {name: n_group, label: "Group index", ui_unit: "", scale: 1.0, default: 3.5, min: 1}
    outputs:
      - {name: delta_nu, label: "Equivalent frequency shift", ui_unit: MHz, scale: 1.0e+6}
      - {name: nu0, label: "Optical frequency", ui_unit: THz, scale: 1.0e+12}
  pair_coherence:
    title: Two-path visibility (Lorentzian source)
    equations: ["V = exp(-2π Δν n_g ΔL / c)", "L_c = c / (π Δν n_g)"]
    inputs:
      - {name: laser_fwhm, label: "Laser linewidth (FWHM)", ui_unit: MHz, scale: 1.0e+6, default: 1, min: 0}
      - {name: path_difference, label: "Geometric path difference", ui_unit: cm, scale: 1.0e-2, default: 10, min: 0}
      - {name: n_group, label: "Group index", ui_unit: "", scale: 1.0, default: 3.5, min: 1}
    outputs:
      - {name: visibility, label: "Pair visibility factor", ui_unit: "", scale: 1.0}
      - {name: coherence_length, label: "Coherence length (geometric)", ui_unit: m, scale: 1.0}
  random_phase_contrast:
    title: Equal-path speckle contrast
    equations: ["C₁ = sqrt(1 - 1/N_paths)", "C_sum = C₁ / sqrt(M_modes)"]
    inputs:
      - {name: n_paths, label: "Paths per mode", ui_unit: "", scale: 1.0, default: 10, min: 1}
      - {name: n_modes, label: "Mode cells on the detector", ui_unit: "", scale: 1.0, default: 1, min: 1}
    outputs:
      - {name: contrast_single, label: "Contrast, one mode", ui_unit: "", scale: 1.0}
      - {name: contrast_sum, label: "Contrast, all modes summed", ui_unit: "", scale: 1.0}
