engine: waveguide_thermal
version: 1
title: Waveguide cross-section heating (2D finite volumes)
description: Steady-state temperature rise of a heated ridge or strip waveguide on a layered substrate (substrate / BOX / film / ridge / cladding), thermal resistance per length, energy time constant, and the resulting index, phase and resonance shifts. Conductivities from the thermo_optic LUT.
requires: [scipy]
references:
  - "S. V. Patankar, Numerical Heat Transfer and Fluid Flow (Hemisphere, 1980) (finite-volume discretisation, harmonic-mean face conductances)"
  - "H. S. Carslaw and J. C. Jaeger, Conduction of Heat in Solids, 2nd ed. (Oxford, 1959) (line source above an isothermal plane, used in the tests)"
functions:
  ridge_heating:
    title: Temperature rise of a heated waveguide
    equations: ["∇·(k∇T) = -q'''", "R' = ΔT_core / q'", "τ_E = ∫ρ c_p ΔT dA / q'"]
    inputs:
      - {name: heat_per_length, label: "Heat per length q'", ui_unit: mW/mm, scale: 1.0, default: 1, min: 0}
      - {name: core_material, label: "Ridge / strip", type: choice, choices: [si, sio2, si3n4, sinx, ln_e, ln_o, lt_e, lt_o, gaas, algaas, inp, aln, al2o3_film, sapphire, tio2_film, su8], default: si}
      - {name: core_width, label: "Ridge width", ui_unit: µm, scale: 1.0e-6, default: 0.5, min: 0}
      - {name: core_height, label: "Ridge height (above the film)", ui_unit: µm, scale: 1.0e-6, default: 0.22, min: 0}
      - {name: slab_material, label: "Film under the ridge", type: choice, choices: [si, sio2, si3n4, sinx, ln_e, ln_o, lt_e, lt_o, gaas, algaas, inp, aln, al2o3_film, sapphire, tio2_film, su8], default: si}
      - {name: slab_thickness, label: "Film thickness (0 = none)", ui_unit: µm, scale: 1.0e-6, default: 0, min: 0}
      - {name: box_material, label: "Buried layer", type: choice, choices: [sio2, si3n4, sinx, al2o3_film, sapphire, su8, aln], default: sio2}
      - {name: box_thickness, label: "Buried-layer thickness", ui_unit: µm, scale: 1.0e-6, default: 2, min: 0}
      - {name: substrate_material, label: "Substrate", type: choice, choices: [si, sio2, sapphire, gaas, inp, ln_e, lt_e, aln], default: si}
      - {name: substrate_thickness, label: "Substrate thickness", ui_unit: µm, scale: 1.0e-6, default: 500, min: 0}
      - {name: clad_material, label: "Cladding", type: choice, choices: [sio2, si3n4, sinx, al2o3_film, tio2_film, su8, air], default: sio2}
      - {name: clad_thickness, label: "Cladding height above the buried layer", ui_unit: µm, scale: 1.0e-6, default: 2, min: 0}
      - {name: domain_half_width, label: "Chip half-width", ui_unit: µm, scale: 1.0e-6, default: 500, min: 0}
      - {name: h_top, label: "Top heat-transfer coefficient", ui_unit: W/(m² K), scale: 1.0, default: 10, min: 0}
    outputs:
      - {name: dT_core, label: "Mean ΔT in the ridge", ui_unit: K, scale: 1.0}
      - {name: dT_max, label: "Peak ΔT", ui_unit: K, scale: 1.0}
      - {name: R_th, label: "R' (= ΔT in K per mW/mm)", ui_unit: K m/W, scale: 1.0}
      - {name: dT_box_top, label: "ΔT at the buried-layer top (centre)", ui_unit: K, scale: 1.0}
      - {name: dT_substrate_top, label: "ΔT at the substrate top (centre)", ui_unit: K, scale: 1.0}
      - {name: tau_E, label: "Energy time constant τ_E", ui_unit: µs, scale: 1.0e-6}
      - {name: heat_balance, label: "Heat balance check (1 = exact)", ui_unit: "", scale: 1.0}
      - {name: n_cells, label: "Grid cells (half domain)", ui_unit: "", scale: 1.0}
