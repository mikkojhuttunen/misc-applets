[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "math-engines"
version = "0.1.0"
description = "Small, tested, UI-free physics engines (SI units in, Result out)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7", "pyyaml>=6"]

[tool.setuptools]
packages = ["engines", "engines.gaussian_beam", "engines.fiber_mode", "engines.parametric_amplifier", "engines.stimulated_scattering"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["engines"]
