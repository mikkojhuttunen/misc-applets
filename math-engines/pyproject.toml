[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "math-engines"
version = "0.1.0"
description = "Pure-function physics engines with machine-readable specs, shared by the misc-applets front ends."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pyyaml>=6"]

[project.optional-dependencies]
fiber = ["scipy>=1.10"]
test = ["pytest>=7", "scipy>=1.10"]

[tool.setuptools]
packages = ["engines"]

[tool.pytest.ini_options]
testpaths = ["engines"]
python_files = ["test_*.py"]
